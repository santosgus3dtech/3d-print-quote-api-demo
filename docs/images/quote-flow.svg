<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">3D print quote API flow</title>
  <desc id="desc">Flow diagram showing fake quote inputs, pricing engine, breakdown and API response.</desc>
  <rect width="1120" height="470" rx="18" fill="#f8fafc"/>
  <defs>
    <style>
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .api{fill:#eff6ff;stroke:#2563eb}
      .calc{fill:#f0fdf4;stroke:#16a34a}
      .out{fill:#fff7ed;stroke:#ea580c}
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#111827}
      .h{font-size:22px;font-weight:850}
      .p{font-size:15px}
      .s{font-size:12px;fill:#475569}
      .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <text x="42" y="48" class="t h">3D Print Quote API Demo</text>
  <text x="42" y="76" class="t s">Sanitized business-rule API for 3D-printing cost estimation</text>
  <rect x="60" y="150" width="210" height="130" rx="12" class="box"/>
  <text x="104" y="192" class="t p">Quote inputs</text>
  <text x="104" y="218" class="t s">Material, weight, time</text>
  <text x="104" y="238" class="t s">Printer, labor, fees</text>
  <rect x="330" y="150" width="210" height="130" rx="12" class="box api"/>
  <text x="378" y="192" class="t p">FastAPI</text>
  <text x="378" y="218" class="t s">Pydantic validation</text>
  <text x="378" y="238" class="t s">POST /quote</text>
  <rect x="600" y="130" width="230" height="170" rx="12" class="box calc"/>
  <text x="646" y="176" class="t p">Pricing engine</text>
  <text x="646" y="202" class="t s">Material + energy</text>
  <text x="646" y="222" class="t s">Depreciation + labor</text>
  <text x="646" y="242" class="t s">Failure buffer + margin</text>
  <text x="646" y="262" class="t s">Marketplace fee gross-up</text>
  <rect x="890" y="150" width="190" height="130" rx="12" class="box out"/>
  <text x="930" y="192" class="t p">Breakdown</text>
  <text x="930" y="218" class="t s">Unit price</text>
  <text x="930" y="238" class="t s">Total price</text>
  <path d="M270 215 H330" class="arrow"/>
  <path d="M540 215 H600" class="arrow"/>
  <path d="M830 215 H890" class="arrow"/>
</svg>
